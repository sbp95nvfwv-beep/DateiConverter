name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          swift build -c release --triple arm64-apple-macosx13.0
          cp "$(swift build --show-bin-path -c release --triple arm64-apple-macosx13.0)/DateiConverter" /tmp/DateiConverter-arm64
          swift build -c release --triple x86_64-apple-macosx13.0
          mkdir -p dist/DateiConverter.app/Contents/MacOS
          cp "$(swift build --show-bin-path -c release --triple x86_64-apple-macosx13.0)/DateiConverter" /tmp/DateiConverter-x86_64
          lipo -create /tmp/DateiConverter-arm64 /tmp/DateiConverter-x86_64 -output dist/DateiConverter.app/Contents/MacOS/DateiConverter
          cp Packaging/Info.plist dist/DateiConverter.app/Contents/Info.plist
          codesign --force --deep --sign - dist/DateiConverter.app
          ditto -c -k --sequesterRsrc --keepParent dist/DateiConverter.app DateiConverter-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DateiConverter-macOS
          path: DateiConverter-macOS.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DateiConverter-macOS.zip --title "DateiConverter $GITHUB_REF_NAME" --generate-notes
